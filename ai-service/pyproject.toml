[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data", "model-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# These imports belong to the explicit Qdrant/FastEmbed runtime profile and are
# intentionally absent from the base/dev lock used by the production-code gate.
[[tool.mypy.overrides]]
module = ["fastembed", "qdrant_client"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]
omit = [".venv/*", "scripts/*", "tests/*"]

[tool.coverage.report]
fail_under = 88.0
precision = 1
show_missing = true
skip_covered = false
