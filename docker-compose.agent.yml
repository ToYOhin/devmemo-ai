# Explicit local-only Agent runtime overlay. Do not use this for public or
# multi-instance deployments. The default docker-compose.yml remains disabled.
services:
  memos:
    build:
      context: .
      dockerfile: scripts/Dockerfile
      args:
        VERSION: ${DEVMEMO_AGENT_VERSION:-local-agent}
        COMMIT: ${DEVMEMO_AGENT_COMMIT:-local}
    image: devmemo-ai-memos-agent:local
    profiles: ["agent"]
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      GOMAXPROCS: "1"
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      AI_AGENT_INTERNAL_URL: http://ai-service:8000
      AI_AGENT_INTERNAL_SECRET: ${AI_AGENT_INTERNAL_SECRET:-}
      AI_AGENT_REHYDRATION_ENABLED: ${AI_AGENT_REHYDRATION_ENABLED:-false}
      AI_AGENT_REHYDRATION_SECRET_CURRENT: ${AI_AGENT_REHYDRATION_SECRET_CURRENT:-}
      AI_AGENT_REHYDRATION_SECRET_PREVIOUS: ${AI_AGENT_REHYDRATION_SECRET_PREVIOUS:-}
      AI_AGENT_LIFECYCLE_ENABLED: ${AI_AGENT_LIFECYCLE_ENABLED:-false}
      AI_AGENT_LIFECYCLE_SECRET: ${AI_AGENT_LIFECYCLE_SECRET:-}
      AI_AGENT_LIFECYCLE_GENERATION: ${AI_AGENT_LIFECYCLE_GENERATION:-}

  ai-service:
    build:
      args:
        INSTALL_QDRANT: "true"
    # The BFF is the only browser entry point in Agent mode.
    ports: !reset []
    expose:
      - "8000"
    profiles: ["agent"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    environment:
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      AI_AGENT_INTERNAL_SECRET: ${AI_AGENT_INTERNAL_SECRET:-}
      AI_AGENT_REHYDRATION_ENABLED: ${AI_AGENT_REHYDRATION_ENABLED:-false}
      AI_AGENT_REHYDRATION_SECRET_CURRENT: ${AI_AGENT_REHYDRATION_SECRET_CURRENT:-}
      AI_AGENT_REHYDRATION_SECRET_PREVIOUS: ${AI_AGENT_REHYDRATION_SECRET_PREVIOUS:-}
      AI_AGENT_REHYDRATION_MEMOS_URL: http://memos:5230
      AI_AGENT_LIFECYCLE_ENABLED: ${AI_AGENT_LIFECYCLE_ENABLED:-false}
      AI_AGENT_LIFECYCLE_SECRET: ${AI_AGENT_LIFECYCLE_SECRET:-}
      AI_AGENT_LIFECYCLE_GENERATION: ${AI_AGENT_LIFECYCLE_GENERATION:-}

  qdrant:
    ports: !reset []
    expose:
      - "6333"
