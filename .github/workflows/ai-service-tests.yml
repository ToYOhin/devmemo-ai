name: AI Service Tests

on:
  push:
    branches: [main]
    paths:
      - "ai-service/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "docker-compose.local-webhook.yml"
      - "docker-compose.agent.yml"
      - ".release-please-manifest.json"
      - "CHANGELOG_DEVMEMO.md"
      - ".github/workflows/ai-service-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-service/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "docker-compose.local-webhook.yml"
      - "docker-compose.agent.yml"
      - ".release-please-manifest.json"
      - "CHANGELOG_DEVMEMO.md"
      - ".github/workflows/ai-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python quality and Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AI Service dependencies
        working-directory: ai-service
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Lint AI Service
        working-directory: ai-service
        run: python -m ruff check app tests scripts main.py database.py embedding.py lifecycle_report.py llm.py rag.py

      - name: Type-check AI Service production code
        working-directory: ai-service
        run: python -m mypy app main.py database.py embedding.py lifecycle_report.py llm.py rag.py

      - name: Run AI Service tests with branch coverage
        working-directory: ai-service
        run: python -m coverage run --branch -m pytest -q tests

      - name: Enforce AI Service coverage baseline
        working-directory: ai-service
        run: python -m coverage report --show-missing

      - name: Validate safe default and local development Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local-webhook.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.agent.yml --profile agent config --quiet
          AI_AGENT_ENABLED=true AI_AGENT_INTERNAL_SECRET=ci-agent-secret \
            docker compose -f docker-compose.yml -f docker-compose.agent.yml --profile agent config --quiet
