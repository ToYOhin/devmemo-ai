name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Check optional release token
        id: release-token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release Please is skipped: configure a dedicated fine-grained RELEASE_PLEASE_TOKEN to re-enable automatic release proposals."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run release-please
        if: steps.release-token.outputs.available == 'true'
        uses: googleapis/release-please-action@v4
        with:
          # Use a fine-grained PAT so generated tags trigger release.yml.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
