services:
  memos:
    # v0.29.1 is the repository source baseline; the version tag is not published
    # on Docker Hub, so pin the currently published stable image by digest.
    image: neosmemo/memos:stable@sha256:3e1253477066eb2aefa91145f7f9038bb931ed88c8a3ee05310a933594cdba7d
    # Keep the default local product path within one CPU across Memos + AI.
    cpus: "0.75"
    environment:
      GOMAXPROCS: "1"
    ports:
      - "5230:5230"
    volumes:
      - memos-data:/var/opt/memos

  ai-service:
    build:
      context: ./ai-service
    cpus: "0.25"
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-deterministic}
      AI_FASTEMBED_MODEL: ${AI_FASTEMBED_MODEL:-BAAI/bge-small-en-v1.5}
      AI_FASTEMBED_DIMENSION: ${AI_FASTEMBED_DIMENSION:-384}
      AI_FASTEMBED_CACHE_DIR: ${AI_FASTEMBED_CACHE_DIR:-/app/model-cache}
      AI_INDEX_ON_WEBHOOK: ${AI_INDEX_ON_WEBHOOK:-false}
      AI_INDEX_MODE: ${AI_INDEX_MODE:-memo}
      AI_WEBHOOK_SECRET: ${AI_WEBHOOK_SECRET:-}
      AI_OPS_TOKEN: ${AI_OPS_TOKEN:-}
      AI_PUBLIC_CHUNK_RETRIEVAL: ${AI_PUBLIC_CHUNK_RETRIEVAL:-false}
      AI_PUBLIC_CHUNK_SECRET: ${AI_PUBLIC_CHUNK_SECRET:-}
      AI_VECTOR_STORE: ${AI_VECTOR_STORE:-memory}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-devmemo_memos}
      QDRANT_CHUNK_COLLECTION: ${QDRANT_CHUNK_COLLECTION:-devmemo_memo_chunks}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      AI_CORS_ORIGINS: "${AI_CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_NOTES_DB: /app/data/ai_notes.db
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ai-data:/app/data
      - ai-model-cache:/app/model-cache
  qdrant:
    # Pinned to the Qdrant 1.18.2 image verified in Phase 3g.
    image: qdrant/qdrant:latest@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    cpus: "0.5"
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    cpus: "1.0"
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  memos-data:
  ai-data:
  ai-model-cache:
  qdrant-data:
  ollama-data:
